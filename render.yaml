services:
  - type: web
    name: ai-hiring-lab-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT server:app
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ai-hiring-lab-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: FLASK_DEBUG
        value: "false"

  - type: web
    name: ai-hiring-lab-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: ai-hiring-lab-db
    plan: free
